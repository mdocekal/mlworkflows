[build-system]
requires = ["setuptools >= 61.0"] # torch is required for flash-attn
build-backend = "setuptools.build_meta"

[project]
name = "mlworkflows"
dynamic = ["dependencies"]
version = "0.0.1"
requires-python = ">=3.10"
authors = [
  {name = "Martin Dočekal"},
]
description = "Package with ML workflows."
readme = "README.md"
keywords = ["workflows", "ml", "machine learning"]

[project.urls]
Repository = "https://github.com/mdocekal/mlworkflows"

[project.scripts]
mlworkflows = "mlworkflows.__main__:main"

[tool.setuptools.packages.find]
include = ["mlworkflows*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
